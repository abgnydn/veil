[package]
name = "veil"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Privacy-preserving pseudonymization pipeline for LLM requests."
authors = ["Ahmet Barış Günaydın <hi@barisgunaydin.com>"]
repository = "https://github.com/abgnydn/veil"

[dependencies]
axum = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
